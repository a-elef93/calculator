<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeral</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="top-section">
        <div class="header">
            <h1>Numeral</h1>
        </div>
        <div class="quote">
            <h4>Calculator for the web</h4>
        </div>
    </div>
    <div class="calculator">
        <div class="display">
            <h3>my field</h3>
        </div>
        <div class="buttons">
            <!-- 1st row buttons -->
            <button>⌫</button>
            <button>AC</button>
            <button>%</button>
            <button>÷</button>
            <!-- 2nd row buttons -->
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>
            <!-- 3rd row buttons -->
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <!-- 4th row buttons -->
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <!-- 5th row buttons -->
            <button>+/-</button>
            <button>0</button>
            <button>,</button>
            <button>=</button>
        </div>
    </div>
</body>
</html>
