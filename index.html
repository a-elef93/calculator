<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numeral</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="top-section">
        <div class="header">
            <h1>Numeral</h1>
        </div>
        <div class="quote">
            <h4>Calculator for the web</h4>
        </div>
    </div>
    <div class="calculator">
        <div class="display">0</div>
        <div class="buttons">
            <!-- 1st row buttons -->
            <button class="backspace">⌫</button>
            <button class="clear">AC</button>
            <button class="percent">%</button>
            <button class="operator">÷</button>
            <!-- 2nd row buttons -->
            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator">×</button>
            <!-- 3rd row buttons -->
            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="operator">-</button>
            <!-- 4th row buttons -->
            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="operator">+</button>
            <!-- 5th row buttons -->
            <button>+/-</button>
            <button class="number">0</button>
            <button class="decimals">.</button>
            <button class="equals">=</button>
        </div>
    </div>
    <div class="footer">
        <p>
         Built by <a href="https://github.com/a-elef93" target="_blank">Anastastios Eleftheriadis</a> as part of <a href="https://www.theodinproject.com/" target="_blank">The Odin Project</a>
        </p>
    </div>
</body>
</html>
